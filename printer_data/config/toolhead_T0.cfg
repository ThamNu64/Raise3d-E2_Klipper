#####################################################################
# TOOLBOARD LINKS (T0)
#####################################################################

[mcu tool_left]
serial: /dev/serial/by-path/USB-ID-LINKS
baud: 250000
restart_method: command

[temperature_sensor tool_left_mcu]
sensor_type: temperature_mcu
sensor_mcu: tool_left

#####################################################################
# LDC1612 PROBE (LINKS)
#####################################################################

[probe_eddy_current fly_probe]
sensor_type: ldc1612
i2c_mcu: tool_left
i2c_bus: i2c1
x_offset: 0
y_offset: 0
speed: 5
lift_speed: 15
descend_z: 2