# ============================================================================
#  Klipper printer.cfg  -  Raise3D E2 (IDEX)  |  STOCK-BOARD
# ----------------------------------------------------------------------------
#  MCU:  Atmel SAM4E8E (Plattform "DuetNG", 6 native TMC2660 ueber USART1-SPI).
#
#  ALLE PINS vollstaendig aufgeloest aus:
#    - Pins_DuetNG.h  (STEP/DIR/EN/ENDSTOP/HEAT/TEMP/FAN-Arrays, RRF-Pin-Nrn)
#    - variant.cpp    (RRF-Pinnummer -> SAM4E-Port, g_APinDescription[])
#    - config.g/.json (Maschinenwerte: Wege, Speed, Strom, Limits, Thermistor)
#
#  VOR ERSTBETRIEB (Motor lose / kleiner Strom):
#    (1) QUERY_ENDSTOPS -> Endstop-Polaritaet pruefen ('!' ergaenzen/entfernen).
#    (2) Motorrichtung pruefen -> dir_pin ggf. mit '!' invertieren.
#    (3) PID + rotation_distance(E) kalibrieren.
#    (4) Probe-Deploy (PC2) nur falls die Sonde mechanisch aus-/einfaehrt.
# ============================================================================

# ---- Klipper-Standardsektionen ----
[virtual_sdcard]
path: ~/printer_data/gcodes
[display_status]
[pause_resume]
[include idex_macros.cfg]
[include macros.cfg]
[include mainsail.cfg]

#################################################################
# OUTPUT TESTS
#################################################################
[output_pin test_pc18]
pin: PC18
value: 0

[output_pin test_pc19]
pin: PC19
value: 0

[output_pin test_pc24]
pin: PC24
value: 0

[output_pin test_pd0]
pin: PD0
value: 0

[output_pin test_pd1]
pin: PD1
value: 0

# ----------------------------------------------------------------------------
#  MCU
# ----------------------------------------------------------------------------
[mcu]
serial: /dev/serial/by-id/usb-Klipper_sam4e8e_0032305334464C573136303235303234-if00

[printer]
kinematics: cartesian
max_velocity: 150            # M203 X/Y 9000 mm/min = 150 mm/s
max_accel: 1000             # M201 X1000
max_z_velocity: 12          # M203 Z720 mm/min = 12 mm/s
max_z_accel: 100            # M201 Z100
square_corner_velocity: 8   # aus Jerk M566 X480 mm/min


# ============================================================================
#  STEPPER   (Reihenfolge aus M584 X0 Y1 Z2 E3:4 U5)
# ============================================================================

# ---- X  (Drive 0) ----------------------------------------------------------
[stepper_x]
step_pin: PD6              # STEP 70
dir_pin: !PD11            # DIR 75   (M569 P0 S0)  ock-inverted!
enable_pin: !PC6           # globales TMC2660-ENN (Pin 38)
microsteps: 16
rotation_distance: 40      # (200*256)/1280  (M92 X1280 @ M350 256)
full_steps_per_rotation: 200
endstop_pin: ^PC14         # END_STOP 46  (M574 X1 = X-min; ggf. ^!PC14)
position_min: -3           # M208 X-3
position_endstop: -3
position_max: 327          # M208 X327
homing_speed: 30           # homing_speed_fast 30 (slow 6)
homing_retract_dist: 5

# ---- Y  (Drive 1) ----------------------------------------------------------
[stepper_y]
step_pin: PD7             # STEP 71
dir_pin: !PD12            # DIR 76   (M569 P1 S0)  ock-inverted!
enable_pin: !PC6
microsteps: 16
rotation_distance: 40      # M92 Y1280
full_steps_per_rotation: 200
endstop_pin: ^PA2          # END_STOP 02  (M574 Y1 = Y-min)
position_min: 0
position_endstop: 0
position_max: 240          # M208 Y240
homing_speed: 30

# ---- Z  (Drive 2) ----------------------------------------------------------
#  E2 homt Z zum OBEREN Endschalter (M574 Z2 = Z-max), danach Probe.
[stepper_z]
step_pin: PD8             # STEP 72
dir_pin: !PD13            # DIR 77   (M569 P2 S0) ock-inverted!
enable_pin: !PC6
microsteps: 16
rotation_distance: 4       # (200*256)/12800  (M92 Z12800; dual/single = 6400 -> 8)
full_steps_per_rotation: 200
endstop_pin: ^PD29         # END_STOP 93  (M574 Z2 = Z-max)
position_max: 240          # M208 Z240
position_min: -1
position_endstop: 240       
homing_speed: 12
homing_positive_dir: true

# ---- U = DUAL CARRIAGE (rechter Schlitten / Drive 5, ONBOARD) --------------
[dual_carriage]
axis: x
step_pin: PD2             # STEP 66
dir_pin: !PD28            # DIR 92   (M569 P5 S0)  ock-inverted!
enable_pin: !PC6
microsteps: 16
rotation_distance: 40      # M92 U1280
full_steps_per_rotation: 200
endstop_pin: ^PD10          # END_STOP 96 = PE0  (M574 U2 = U-max)
position_min: 35           # M208 U35
position_endstop: 355      # M208 U355
position_max: 355
homing_speed: 30           # homing_speed_fast 30 (slow 6)
homing_retract_dist: 5

# ============================================================================
#  EXTRUDER
# ============================================================================

# ---- Extruder 0 (linkes Hotend, Heater H1, Drive 3) ------------------------
[extruder]
step_pin: PD5             # STEP 69
dir_pin: PA1             # DIR 01   (M569 P3 S1 -> ggf. !PA1)
enable_pin: !PC6
microsteps: 16
rotation_distance: 11.907  # (200*256)/4300  (M92 E4300) - NACHKALIBRIEREN
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: !PA20           # HEAT_ON 20 (Heater 1) ock-inverted!
sensor_type: Raise3D_E2     # custom (Beta 4138), siehe unten
sensor_pin: PC15            # TEMP_SENSE 47 (Thermistor 1)
min_temp: -200
max_temp: 3100.             # M143 H1 S310
#min_extrude_temp: 170
min_extrude_temp: 0			# ACHTUNG!!!
control: pid                # -> PID_CALIBRATE HEATER=extruder TARGET=210
pid_Kp: 22.0
pid_Ki: 1.08
pid_Kd: 114.0

# ---- Extruder 1 (rechtes Hotend, Heater H2, Drive 4) -----------------------
[extruder1]
step_pin: PD4             # STEP 68
dir_pin: PD9             # DIR 73   (M569 P4 S1)
enable_pin: !PC6
microsteps: 16
rotation_distance: 11.907  # M92 E4350 (dual) ~ 11.77 -> kalibrieren
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA16           # HEAT_ON 16 (Heater 2)
sensor_type: Generic 3950
sensor_pin: PC12           # TEMP_SENSE 44 (Thermistor 2)
min_temp: -200
max_temp: 3100              # M143 H2 S310
#min_extrude_temp: 170
min_extrude_temp: 0			# ACHTUNG!!!
control: pid               # -> PID_CALIBRATE HEATER=extruder1 TARGET=210
pid_Kp: 22.0
pid_Ki: 1.08
pid_Kd: 114.0


# ============================================================================
#  HEIZBETT  (Heater 0, Thermistor 0)
# ============================================================================
[heater_bed]
heater_pin: !PA19           # HEAT_ON 19 (Heater 0) ock-inverted!
sensor_type: Generic 3950        # custom (Beta 3950), siehe unten
sensor_pin: PC13           # TEMP_SENSE 45 (Thermistor 0)
min_temp: -200
max_temp: 1200              # M143 H0 S115..120
control: pid               # -> PID_CALIBRATE HEATER=heater_bed TARGET=60
pid_Kp: 54.0
pid_Ki: 0.77
pid_Kd: 950.0


# ============================================================================
#  THERMISTOREN  (Werte aus deiner config.g / M305; Serie 4700)
# ============================================================================
#  Hinweis: Pins_DuetNG.h-Defaults (BED 3988 / EXT 4388) weichen ab ->
#  massgeblich sind DEINE M305-Werte.
#[thermistor E2_bed]
#temperature1: 25
#resistance1: 100000
#beta: 3950                 # M305 P0 B3950

[thermistor Raise3D_E2]
temperature1: 25
resistance1: 100000
beta: 4138                 # M305 P1/P2 B4138


# ============================================================================
#  Z-PROBE / BED MESH
# ============================================================================
#  RRF: M558 P5 (Schalter) + G31 X15 Y18 Z2.45 ; Z_PROBE_PIN 33=PC1
#[probe]
#pin: ^PC1                  # Z_PROBE_PIN 33 = PC1  (ggf. ^!PC1 nach Test)
#x_offset: 15               # G31 X15
#y_offset: 18               # G31 Y18
#z_offset: 2.45             # G31 Z2.45 - kalibrieren (PROBE_CALIBRATE)
#speed: 2                   # config.json probe speed
#samples: 2

# Probe-Deploy nur falls Sonde mechanisch bewegt wird (RRF M280 P100):
# Z_PROBE_MOD_PIN 34 = PC2. Dann im Homing-Makro schalten.
#[output_pin probe_deploy]
#pin: PC2                  # Z_PROBE_MOD_PIN 34 = PC2

#[bed_mesh]
#mesh_min: 15, 18           # M557 X15 Y18
#mesh_max: 305, 225         # bed.g / M557
#probe_count: 5, 5
#algorithm: bicubic
# 4-Punkt-Referenz aus bed.g: (15/15)(15/225)(305/225)(305/15)


# ============================================================================
#  LUEFTER   -  ACHTUNG: Raise3D hat Fan0/Fan1 getauscht ("raise switched 55 58")
# ============================================================================
#  COOLING_FAN_PINS = { 58, 55, 00, ... } -> Fan0=PC26, Fan1=PC23, Fan2=PA0
[fan]                       # Bauteilluefter (M106 P0) = Fan0
pin: PC26                  # COOLING_FAN 58 = PC26
cycle_time: 0.002          # M106 F500 = 500 Hz

[heater_fan hotend_fan_e0]  # Hotend-Luefter E0 (M106 P1) = Fan1
pin: PC23                  # COOLING_FAN 55 = PC23
heater: extruder
heater_temp: 50.0

[heater_fan hotend_fan_e1]  # Hotend-Luefter E1 (M106 P2) = Fan2
pin: PA0                   # COOLING_FAN 00 = PA0
heater: extruder1
heater_temp: 50.0


# ============================================================================
#  TMC2660-TREIBER  (SPI ueber USART1)  -  Stroeme aus M906
# ============================================================================
#  CS-Pins = "EN"-Array aus Pins_DuetNG.h (bei TMC2660 = SPI-CS je Treiber).
#  run_current(RMS) ~= M906(mA) / 1.414 ; sense_resistor Duet2 = 0.051
[tmc2660 stepper_x]
cs_pin: PD14               # ENABLE_PINS[0] 78 = PD14
spi_bus: usart1
spi_speed: 2000000
run_current: 0.64          # M906 X900
sense_resistor: 0.051

[tmc2660 stepper_y]
cs_pin: PC9                # ENABLE_PINS[1] 41 = PC9
spi_bus: usart1
spi_speed: 2000000
run_current: 0.64          # M906 Y900
sense_resistor: 0.051

[tmc2660 stepper_z]
cs_pin: PC10               # ENABLE_PINS[2] 42 = PC10
spi_bus: usart1
spi_speed: 2000000
run_current: 0.64          # M906 Z900
sense_resistor: 0.051

[tmc2660 extruder]
cs_pin: PC17               # ENABLE_PINS[3] 49 = PC17
spi_bus: usart1
spi_speed: 2000000
run_current: 0.56          # M906 E800
sense_resistor: 0.051

[tmc2660 extruder1]
cs_pin: PC25               # ENABLE_PINS[4] 57 = PC25
spi_bus: usart1
spi_speed: 2000000
run_current: 0.56          # M906 E800
sense_resistor: 0.051

[tmc2660 dual_carriage]
cs_pin: PD23               # ENABLE_PINS[5] 87 = PD23
spi_bus: usart1
spi_speed: 2000000
run_current: 0.64          # M906 U900
sense_resistor: 0.051


# ============================================================================
#  FILAMENTSENSOREN  (M591 D0 C6 / D1 C7 -> Endstop-Input 6/7)
# ============================================================================
[filament_switch_sensor filament_e0]
switch_pin: ^PE1           # END_STOP_PINS[6] 97 = PE1  (C6)
[filament_switch_sensor filament_e1]
switch_pin: ^PE2           # END_STOP_PINS[7] 98 = PE2  (C7)

# ============================================================================
#  BAURAUMBELEUCHTUNG UND LÜFTER
# ============================================================================

[output_pin chamber_light]
pin: PA15
value: 0
shutdown_value: 0


# ============================================================================
#  Force Move für Gantry Level
# ============================================================================

[force_move]
enable_force_move: True

# ============================================================================
#   Idle Timeout Verhindert eingeschaltete Heizungen nach längerer Pause.
# ============================================================================

[idle_timeout]
timeout: 1800
gcode:
  TURN_OFF_HEATERS
	M84

# ============================================================================
#   Offsets dauerhaft speichern
# ============================================================================

[save_variables]
filename: ~/printer_data/config/variables.cfg

# ============================================================================
#   Objekte während des Drucks ausklammern
# ============================================================================

[exclude_object]



# ============================================================================
#  FLASH-/BUILD-HINWEISE (Stock-Board behalten)
# ============================================================================
#  make menuconfig:  Atmel SAM3/SAM4 -> SAM4E8E -> Communication: USB
#  make ; Board in SAM-BA-Bootloader versetzen (Erase/Reset), dann:
#     make flash FLASH_DEVICE=/dev/ttyACM0     (bossac)
#  Danach:  ls /dev/serial/by-id/*   -> in [mcu] serial eintragen.
#  Rueckweg zu RRF: Duet2CombinedFirmware.bin per SD/bossac zurueckflashen.


# ============================================================================
#  KOMPLETTE PIN-REFERENZ  (RRF-Pin-Nr -> SAM4E-Port, aus variant.cpp)
# ============================================================================
#  Funktion            RRF#  Port   | Funktion            RRF#  Port
#  ------------------------------- -+- -------------------------------
#  X  step/dir/cs      70/75/78  PD6/PD11/PD14
#  Y  step/dir/cs      71/76/41  PD7/PD12/PC9
#  Z  step/dir/cs      72/77/42  PD8/PD13/PC10
#  E0 step/dir/cs      69/01/49  PD5/PA1/PC17
#  E1 step/dir/cs      68/73/57  PD4/PD9/PC25
#  U  step/dir/cs      66/92/87  PD2/PD28/PD23
#  global TMC2660 ENN  38        PC6
#  Endstop X/Y/Z       46/02/93  PC14/PA2/PD29
#  Endstop U           96        PE0
#  Filament C6/C7      97/98     PE1/PE2
#  Heater bed/H1/H2    19/20/16  PA19/PA20/PA16
#  Thermistor T0/T1/T2 45/47/44  PC13/PC15/PC12
#  Fan0/Fan1/Fan2      58/55/00  PC26/PC23/PA0   (Raise: 55<->58 getauscht)
#  Z-Probe in / mod    33/34     PC1/PC2
#  TMC2660 SPI (USART1) MOSI/MISO/SCLK  PA13/PA22/PA23 (Klipper: spi_bus usart1)
#
#  Maschinenwerte:
#   rotation_distance: X/Y/U 40 | Z 4 (dual/single 8) | E 11.907 (dual 11.77)
#   run_current(RMS):  X/Y/Z/U 0.64 | E0/E1 0.56   (M906 /1.414)
#   Speed: X/Y/U 150 | Z 12 | E 50 mm/s   Accel: X1000 Y500 Z100 E3000
#   Temp-Limits: Bett 115-120 | Hotends 310-320
# ============================================================================
