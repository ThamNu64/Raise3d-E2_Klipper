#####################################################################
# TOOLBOARD LINKS (T0)
#####################################################################

[mcu tool_left]
serial: /dev/serial/by-path/platform-20980000.usb-usb-0:1.1:1.0-port0
baud: 250000
restart_method: command

[temperature_sensor tool_left_mcu]
sensor_type: temperature_mcu
sensor_mcu: tool_left
min_temp: 0
max_temp: 100


#####################################################################
# LDC1612 PROBE (LINKS)
#####################################################################
[probe_eddy_current fly_eddy_probe]
sensor_type: ldc1612
i2c_address: 43
i2c_mcu: tool_left
i2c_bus: i2c1e
# I2C bus identifier, defined according to the MCU
x_offset: 0
# X-direction probe to nozzle offset (mm), adjust based on actual installation measurement
y_offset: 21.42
# Y-direction offset (mm), here set to 21.42, adjust based on actual installation measurement
descend_z: 2.5
# Probe descent stop distance (mm), i.e., safe distance between the nozzle and the heated bed, adjust based on actual settings
i2c_speed: 4000000
# I2C communication speed (Hz), here set to 4MHz
frequency: 40000000
# External crystal frequency (Hz), SHT36V3 uses 40MHZ

[temperature_probe fly_eddy_probe]
sensor_type: Generic 3950
sensor_pin:tool_left:gpio28

#####################################################################
# Beschleunigungssensor (LINKS)
#####################################################################
[lis2dw]
cs_pin: tool_left:gpio12
spi_bus: spi0_gpio4_gpio3_gpio2

[resonance_tester]
accel_chip: lis2dw
probe_points: 150, 150, 20  # Passe x, y, z an die Mitte deines Druckbetts an
