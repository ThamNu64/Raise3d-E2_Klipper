[gcode_macro LOAD_FILAMENT]
description: Laedt Filament mit dem gemessenen Pfad aus dem CAD
gcode:
    {% set extruder = params.EXTRUDER|default('extruder') %}
    SAVE_GCODE_STATE NAME=load_state
    
    M117 Laeade Filament...
    M83 ; Relatives Extrudieren
    
    # Phase 1: Schneller Eilgang bis kurz vor die Schmelzzone (75 mm)
    G1 E75 F1800 ; 30 mm/s
    
    # Phase 2: Langsames Durchspuelen durch die Duese (20 mm)
    G1 E20 F150 ; 2.5 mm/s
    
    # Kurzer Retract, damit die Duese beim Aufheizen/Parken nicht tropft
    G1 E-2 F1800 
    
    RESTORE_GCODE_STATE NAME=load_state
    M117 Filament geladen!

[gcode_macro UNLOAD_FILAMENT]
description: Entlaedt Filament mit Formung der Tip-Spitze
gcode:
    SAVE_GCODE_STATE NAME=unload_state
    
    M117 Entlaade Filament...
    M83 ; Relatives Extrudieren
    
    # 1. Tip-Formung: Kurzer Push und schnelles Entladen aus der Schmelzzone
    G1 E2 F300    ; 2mm Re-Extrude zum Anschmelzen der Spitze
    G1 E-15 F3000 ; Schneller Retract (50 mm/s), um Fäden (Stringing) zu verhindern
    
    # 2. Eilgang: Restliche Distanz aus dem Extruder ziehen (80 mm)
    G1 E-80 F1800 ; 30 mm/s
    
    RESTORE_GCODE_STATE NAME=unload_state
    M117 Filament entladen!