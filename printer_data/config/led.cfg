#####################################################################
# LED.cfg
# Raise3D E2 IDEX mit 2x DragonBurner & Mellow SHT36 V3
#####################################################################

[neopixel dragonburner_left]
pin: tool_left:gpio26
chain_count: 3
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

[neopixel dragonburner_right]
pin: tool_right:gpio26
chain_count: 3
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

#####################################################################
# INTERNER LED-ZUSTAND
#####################################################################

[gcode_macro _LED_STATE]
variable_worklight_left: 0.0
variable_worklight_right: 0.0
variable_status_left: 1
variable_status_right: 1
variable_error_mode: 0
variable_blink_on: 0
gcode:

#####################################################################
# INTERN: RENDER MACROS
#####################################################################

[gcode_macro _LED_RENDER_LEFT]
gcode:
  {% set state = printer["gcode_macro _LED_STATE"] %}
  {% set w = state.worklight_left|float %}
  {% set status = state.status_left|int %}

  SET_LED LED=dragonburner_left INDEX=1 RED={w} GREEN={w} BLUE={w} TRANSMIT=0
  SET_LED LED=dragonburner_left INDEX=2 RED={w} GREEN={w} BLUE={w} TRANSMIT=0

  {% if status == 0 %}
    SET_LED LED=dragonburner_left INDEX=3 RED=0 GREEN=0 BLUE=0
  {% elif status == 1 %}
    SET_LED LED=dragonburner_left INDEX=3 RED=0 GREEN=0 BLUE=1.0
  {% elif status == 2 %}
    SET_LED LED=dragonburner_left INDEX=3 RED=0 GREEN=1.0 BLUE=0
  {% elif status == 3 %}
    SET_LED LED=dragonburner_left INDEX=3 RED=1.0 GREEN=1.0 BLUE=0
  {% elif status == 4 %}
    SET_LED LED=dragonburner_left INDEX=3 RED=0 GREEN=1.0 BLUE=1.0
  {% elif status == 5 %}
    SET_LED LED=dragonburner_left INDEX=3 RED=1.0 GREEN=0 BLUE=1.0
  {% else %}
    SET_LED LED=dragonburner_left INDEX=3 RED=1.0 GREEN=0 BLUE=0
  {% endif %}

[gcode_macro _LED_RENDER_RIGHT]
gcode:
  {% set state = printer["gcode_macro _LED_STATE"] %}
  {% set w = state.worklight_right|float %}
  {% set status = state.status_right|int %}

  SET_LED LED=dragonburner_right INDEX=1 RED={w} GREEN={w} BLUE={w} TRANSMIT=0
  SET_LED LED=dragonburner_right INDEX=2 RED={w} GREEN={w} BLUE={w} TRANSMIT=0

  {% if status == 0 %}
    SET_LED LED=dragonburner_right INDEX=3 RED=0 GREEN=0 BLUE=0
  {% elif status == 1 %}
    SET_LED LED=dragonburner_right INDEX=3 RED=0 GREEN=0 BLUE=1.0
  {% elif status == 2 %}
    SET_LED LED=dragonburner_right INDEX=3 RED=0 GREEN=1.0 BLUE=0
  {% elif status == 3 %}
    SET_LED LED=dragonburner_right INDEX=3 RED=1.0 GREEN=1.0 BLUE=0
  {% elif status == 4 %}
    SET_LED LED=dragonburner_right INDEX=3 RED=0 GREEN=1.0 BLUE=1.0
  {% elif status == 5 %}
    SET_LED LED=dragonburner_right INDEX=3 RED=1.0 GREEN=0 BLUE=1.0
  {% else %}
    SET_LED LED=dragonburner_right INDEX=3 RED=1.0 GREEN=0 BLUE=0
  {% endif %}

[gcode_macro _LED_RENDER_ALL]
gcode:
  _LED_RENDER_LEFT
  _LED_RENDER_RIGHT

[gcode_macro _LED_STOP_ERROR]
gcode:
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=error_mode VALUE=0
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=blink_on VALUE=0
  UPDATE_DELAYED_GCODE ID=_LED_ERROR_BLINK DURATION=0

#####################################################################
# ARBEITSLICHT MACROS
#####################################################################

[gcode_macro WORKLIGHT_ON]
description: Alle vier Arbeitsleuchten weiss mit 100 Prozent
gcode:
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=worklight_left VALUE=1.0
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=worklight_right VALUE=1.0
  {% if printer["gcode_macro _LED_STATE"].error_mode|int == 0 %}
    _LED_RENDER_ALL
  {% endif %}

[gcode_macro WORKLIGHT_DIM]
description: Alle vier Arbeitsleuchten weiss mit 30 Prozent
gcode:
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=worklight_left VALUE=0.3
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=worklight_right VALUE=0.3
  {% if printer["gcode_macro _LED_STATE"].error_mode|int == 0 %}
    _LED_RENDER_ALL
  {% endif %}

[gcode_macro WORKLIGHT_OFF]
description: Alle vier Arbeitsleuchten ausschalten
gcode:
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=worklight_left VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=worklight_right VALUE=0.0
  {% if printer["gcode_macro _LED_STATE"].error_mode|int == 0 %}
    _LED_RENDER_ALL
  {% endif %}

[gcode_macro WORKLIGHT_LEFT_ON]
description: Arbeitsleuchten des linken Toolheads einschalten
gcode:
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=worklight_left VALUE=1.0
  {% if printer["gcode_macro _LED_STATE"].error_mode|int == 0 %}
    _LED_RENDER_LEFT
  {% endif %}

[gcode_macro WORKLIGHT_LEFT_OFF]
description: Arbeitsleuchten des linken Toolheads ausschalten
gcode:
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=worklight_left VALUE=0.0
  {% if printer["gcode_macro _LED_STATE"].error_mode|int == 0 %}
    _LED_RENDER_LEFT
  {% endif %}

[gcode_macro WORKLIGHT_RIGHT_ON]
description: Arbeitsleuchten des rechten Toolheads einschalten
gcode:
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=worklight_right VALUE=1.0
  {% if printer["gcode_macro _LED_STATE"].error_mode|int == 0 %}
    _LED_RENDER_RIGHT
  {% endif %}

[gcode_macro WORKLIGHT_RIGHT_OFF]
description: Arbeitsleuchten des rechten Toolheads ausschalten
gcode:
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=worklight_right VALUE=0.0
  {% if printer["gcode_macro _LED_STATE"].error_mode|int == 0 %}
    _LED_RENDER_RIGHT
  {% endif %}

[gcode_macro WORKLIGHT_SET]
description: Arbeitslichthelligkeit links und rechts einstellen
gcode:
  {% set req_l = params.LEFT|default(printer["gcode_macro _LED_STATE"].worklight_left)|float %}
  {% set req_r = params.RIGHT|default(printer["gcode_macro _LED_STATE"].worklight_right)|float %}
  {% set left = [0.0, [req_l, 1.0]|min]|max %}
  {% set right = [0.0, [req_r, 1.0]|min]|max %}
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=worklight_left VALUE={left}
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=worklight_right VALUE={right}
  {% if printer["gcode_macro _LED_STATE"].error_mode|int == 0 %}
    _LED_RENDER_ALL
  {% endif %}

#####################################################################
# STATUS MACROS
#####################################################################

[gcode_macro LED_IDLE]
description: Beide Statuslichter blau
gcode:
  _LED_STOP_ERROR
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_left VALUE=1
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_right VALUE=1
  _LED_RENDER_ALL

[gcode_macro LED_READY]
description: Beide Statuslichter gruen
gcode:
  _LED_STOP_ERROR
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_left VALUE=2
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_right VALUE=2
  _LED_RENDER_ALL

[gcode_macro LED_HEATING_T0]
description: Linker Toolhead heizt (Logo gelb, rechts gruen)
gcode:
  _LED_STOP_ERROR
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_left VALUE=3
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_right VALUE=2
  _LED_RENDER_ALL

[gcode_macro LED_HEATING_T1]
description: Rechter Toolhead heizt (Logo gelb, links gruen)
gcode:
  _LED_STOP_ERROR
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_left VALUE=2
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_right VALUE=3
  _LED_RENDER_ALL

[gcode_macro LED_HEATING_BOTH]
description: Beide Toolheads heizen (beide Logos gelb)
gcode:
  _LED_STOP_ERROR
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_left VALUE=3
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_right VALUE=3
  _LED_RENDER_ALL

[gcode_macro LED_PRINTING_T0]
description: Linker Toolhead druckt (Logo tuerkis, rechts gruen)
gcode:
  _LED_STOP_ERROR
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_left VALUE=4
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_right VALUE=2
  _LED_RENDER_ALL

[gcode_macro LED_PRINTING_T1]
description: Rechter Toolhead druckt (Logo tuerkis, links gruen)
gcode:
  _LED_STOP_ERROR
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_left VALUE=2
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_right VALUE=4
  _LED_RENDER_ALL

[gcode_macro LED_PRINTING_BOTH]
description: Beide Toolheads drucken, z.B. Copy oder Mirror
gcode:
  _LED_STOP_ERROR
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_left VALUE=4
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_right VALUE=4
  _LED_RENDER_ALL

[gcode_macro LED_PAUSE]
description: Beide Statuslichter magenta
gcode:
  _LED_STOP_ERROR
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_left VALUE=5
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_right VALUE=5
  _LED_RENDER_ALL

[gcode_macro LED_STATUS_OFF]
description: Nur die beiden Statuslichter ausschalten
gcode:
  _LED_STOP_ERROR
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_left VALUE=0
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_right VALUE=0
  _LED_RENDER_ALL

#####################################################################
# FEHLERBLINKEN & CLEAR
#####################################################################

[gcode_macro LED_ERROR_LEFT]
description: Linken Toolhead komplett rot blinken lassen
gcode:
  UPDATE_DELAYED_GCODE ID=_LED_ERROR_BLINK DURATION=0
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=error_mode VALUE=1
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=blink_on VALUE=0
  _LED_RENDER_RIGHT
  UPDATE_DELAYED_GCODE ID=_LED_ERROR_BLINK DURATION=0.01

[gcode_macro LED_ERROR_RIGHT]
description: Rechten Toolhead komplett rot blinken lassen
gcode:
  UPDATE_DELAYED_GCODE ID=_LED_ERROR_BLINK DURATION=0
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=error_mode VALUE=2
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=blink_on VALUE=0
  _LED_RENDER_LEFT
  UPDATE_DELAYED_GCODE ID=_LED_ERROR_BLINK DURATION=0.01

[gcode_macro LED_ERROR_GLOBAL]
description: Beide Toolheads komplett rot blinken lassen
gcode:
  UPDATE_DELAYED_GCODE ID=_LED_ERROR_GLOBAL DURATION=0
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=error_mode VALUE=3
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=blink_on VALUE=0
  UPDATE_DELAYED_GCODE ID=_LED_ERROR_BLINK DURATION=0.01

[gcode_macro LED_ERROR_CLEAR]
description: Fehlerblinken beenden und LED-Zustand wiederherstellen
gcode:
  _LED_STOP_ERROR
  _LED_RENDER_ALL

[delayed_gcode _LED_ERROR_BLINK]
initial_duration: 0
gcode:
  {% set state = printer["gcode_macro _LED_STATE"] %}
  {% set mode = state.error_mode|int %}
  {% set blink = state.blink_on|int %}

  {% if mode > 0 %}
    {% if blink == 0 %}
      {% if mode == 1 or mode == 3 %}
        SET_LED LED=dragonburner_left INDEX=1 RED=1.0 GREEN=0 BLUE=0 TRANSMIT=0
        SET_LED LED=dragonburner_left INDEX=2 RED=1.0 GREEN=0 BLUE=0 TRANSMIT=0
        SET_LED LED=dragonburner_left INDEX=3 RED=1.0 GREEN=0 BLUE=0
      {% endif %}
      {% if mode == 2 or mode == 3 %}
        SET_LED LED=dragonburner_right INDEX=1 RED=1.0 GREEN=0 BLUE=0 TRANSMIT=0
        SET_LED LED=dragonburner_right INDEX=2 RED=1.0 GREEN=0 BLUE=0 TRANSMIT=0
        SET_LED LED=dragonburner_right INDEX=3 RED=1.0 GREEN=0 BLUE=0
      {% endif %}
      SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=blink_on VALUE=1
    {% else %}
      {% if mode == 1 or mode == 3 %}
        SET_LED LED=dragonburner_left INDEX=1 RED=0 GREEN=0 BLUE=0 TRANSMIT=0
        SET_LED LED=dragonburner_left INDEX=2 RED=0 GREEN=0 BLUE=0 TRANSMIT=0
        SET_LED LED=dragonburner_left INDEX=3 RED=0 GREEN=0 BLUE=0
      {% endif %}
      {% if mode == 2 or mode == 3 %}
        SET_LED LED=dragonburner_right INDEX=1 RED=0 GREEN=0 BLUE=0 TRANSMIT=0
        SET_LED LED=dragonburner_right INDEX=2 RED=0 GREEN=0 BLUE=0 TRANSMIT=0
        SET_LED LED=dragonburner_right INDEX=3 RED=0 GREEN=0 BLUE=0
      {% endif %}
      SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=blink_on VALUE=0
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_LED_ERROR_BLINK DURATION=0.5
  {% endif %}

[gcode_macro LED_OFF]
description: Alle Status- und Arbeitsleuchten ausschalten
gcode:
  _LED_STOP_ERROR
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=worklight_left VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=worklight_right VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_left VALUE=0
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_right VALUE=0
  SET_LED LED=dragonburner_left RED=0 GREEN=0 BLUE=0
  SET_LED LED=dragonburner_right RED=0 GREEN=0 BLUE=0

[delayed_gcode _LED_STARTUP]
initial_duration: 1.0
gcode:
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=worklight_left VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=worklight_right VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_left VALUE=1
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=status_right VALUE=1
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=error_mode VALUE=0
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=blink_on VALUE=0
  _LED_RENDER_ALL
