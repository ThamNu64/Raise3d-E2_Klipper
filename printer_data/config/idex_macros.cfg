# ====================================================================
# Raise3D E2 - IDEX & Toolchange Macros
# ====================================================================

[respond]
default_type: echo

# --------------------------------------------------------------------
# HOMING OVERRIDE (Sicheres Referenzieren für IDEX)
# --------------------------------------------------------------------
[gcode_macro MAKE_X_AXIS_LEVEL]
description: X-Achse am oberen Z-Anschlag ausrichten (mit Konsolen-Outputs)
gcode:
    # 1. Homing-Check
    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND MSG="Führe Initial-Homing aus..."
        G28
    {% else %}
         RESPOND MSG="Ist homed"
    {% endif %}
  
    # 2. Motorstrom absenken
    RESPOND MSG="Senke Z-Strom auf 0.25A..."
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.25

    # 3. Mechanisch in den Anschlag drücken
    RESPOND MSG="Drücke Z 4mm in den Anschlag..."
    FORCE_MOVE STEPPER=stepper_z DISTANCE=4 VELOCITY=5
    
    # 4. Strom wieder anheben
    RESPOND MSG="Setze Z-Strom zurück auf 0.64A..."
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.64
    
    # 5. Position setzen
    G28 Z
    RESPOND MSG="X-Achse erfolgreich ausgerichtet!"


# --------------------------------------------------------------------
# PARK-MAKROS (Köpfe an den Bett-Rändern parken)
# --------------------------------------------------------------------
[gcode_macro PARK_ACTIVE_TOOL]
description: Erkennt IDEX-Modus und parkt T0, T1 oder beide koepfe bei Mirror/Duplication
gcode:
    {% if printer.dual_carriage is defined %}
        {% set mode = printer.dual_carriage.active_carriage %}
        
        # 1. Fall: Mirror- oder Duplication-Modus aktiv
        {% if printer.dual_carriage.mode == "MIRROR" or printer.dual_carriage.mode == "COPY" %}
            M117 Parke beide Toolheads (Sync-Modus)...
            # Koppelung aufheben & auf primären Schlitten zurückstellen
            SET_DUAL_CARRIAGE CARRIAGE=0 MODE=FULL_CONTROL
            
            # Beide Köpfe gleichzeitig an ihre äußeren Parkpositionen fahren
            # X = Linker Parkanschlag (T0), DC_VARS.park_x = Rechter Parkanschlag (T1)
            G91
            G1 Z2
            G90
            G1 X-2 Y{printer.toolhead.axis_maximum.y} F12000
            
            # T1 explizit auf seine Parkposition setzen
            SET_DUAL_CARRIAGE CARRIAGE=1
            G1 X353 F12000
            SET_DUAL_CARRIAGE CARRIAGE=0

        # 2. Fall: Einzeldruck - T1 (Rechts) ist aktiv
        {% elif mode == "CARRIAGE_1" %}
            PARK_T1
            
        # 3. Fall: Einzeldruck - T0 (Links) ist aktiv
        {% else %}
            PARK_T0
        {% endif %}
    {% else %}
        PARK_T0
    {% endif %}

# ====================================================================
# Toolchange-Makros (T0 & T1)
# ====================================================================
[gcode_macro T0]
description: Wechselt zu Werkzeug 0 (T0)
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND MSG="Drucker nicht gehomed! Bitte zuerst G28 ausführen."
    {% else %}
        SAVE_GCODE_STATE NAME=toolchange_state
        
        # 1. Z-Hop (0.4mm) gegen Kollisionen mit dem Druckteil
        G91
        G1 Z0.4 F600
        G90

        # 2. Retract am AKTUELL aktiven Extruder vor dem Parken
        {% set act_ext = printer.toolhead.extruder %}
        {% if act_ext != '' and printer[act_ext].can_extrude %}
            G92 E0
            G1 E-2 F2400
        {% endif %}

        # 3. T1 Parken
        PARK_T1

        # 4. T0 Aktivieren & Anfahren
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        SET_DUAL_CARRIAGE CARRIAGE=0

        # 5. Un-retract für T0
        {% if printer.extruder.can_extrude %}
            G92 E0
            G1 E2 F2400
        {% endif %}
        
		# 5. LED-UPDATE T0
        _UPDATE_IDEX_LEDS MODE=T0
        
        RESTORE_GCODE_STATE NAME=toolchange_state
    {% endif %}

[gcode_macro T1]
description: Wechselt zu Werkzeug 1 (T1)
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND MSG="Drucker nicht gehomed! Bitte zuerst G28 ausführen."
    {% else %}
        SAVE_GCODE_STATE NAME=toolchange_state
        
        # 1. Z-Hop (0.4mm) gegen Kollisionen mit dem Druckteil
        G91
        G1 Z0.4 F600
        G90

        # 2. Retract am AKTUELL aktiven Extruder vor dem Parken
        {% set act_ext = printer.toolhead.extruder %}
        {% if act_ext != '' and printer[act_ext].can_extrude %}
            G92 E0
            G1 E-2 F2400
        {% endif %}

        # 3. T0 Parken
        PARK_T0

        # 4. T1 Aktivieren & Anfahren
        ACTIVATE_EXTRUDER EXTRUDER=extruder1
        SET_DUAL_CARRIAGE CARRIAGE=1

        # 5. Un-retract für T1
        {% if printer.extruder1.can_extrude %}
            G92 E0
            G1 E2 F2400
        {% endif %}

        # 5. LED-UPDATE T1
        _UPDATE_IDEX_LEDS MODE=T1
        
        RESTORE_GCODE_STATE NAME=toolchange_state
    {% endif %}

# --------------------------------------------------------------------
# SONDERMODI: COPY & MIRROR (Verdopplungs- & Spiegelmodus)
# --------------------------------------------------------------------
[gcode_macro MODE_FULL_CONTROL]
description: Reaktiviert den normalen IDEX-Unabhängigkeitsmodus
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=FULL_CONTROL
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    _UPDATE_IDEX_LEDS MODE=T0
    M117 Normalmodus (IDEX) aktiv

[gcode_macro MODE_COPY]
description: Startet den Duplikationsmodus (beide Köpfe aktiv)
gcode:
    G28
    PARK_T0
    PARK_T1
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=FULL_CONTROL
    G1 X0 F12000
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=COPY
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    _UPDATE_IDEX_LEDS MODE=BOTH
    M117 Copy-Modus aktiv

[gcode_macro MODE_MIRROR]
description: Startet den Spiegelmodus (beide Köpfe aktiv)
gcode:
    G28
    PARK_T0
    PARK_T1
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=FULL_CONTROL
    G1 X0 F12000
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=MIRROR
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    _UPDATE_IDEX_LEDS MODE=BOTH
    M117 Mirror-Modus aktiv