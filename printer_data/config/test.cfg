# --- Bereits von Raise3D umfunktioniert (siehe Pins_DuetNG.h E6_*) ---
[output_pin test_pb14_led]
pin: PB14
value: 0
shutdown_value: 0
# !!! Das ist laut Raise3D-Kommentar "//LED" - vermutlich schon die gesuchte LED,
# kein freier Testpin. Sollte bereits leuchten/blinken ohne dein Zutun.

[output_pin test_pd27_power12]
pin: PD27
value: 0
shutdown_value: 0
# !!! Kommentar "//POWER 12" - schaltet moeglicherweise eine 12V-Schiene fuer
# andere Elektronik. Mit Vorsicht testen, ggf. andere Baugruppe beobachten.

[output_pin test_pc0_pro2]
pin: PC0
value: 0
shutdown_value: 0
# !!! Kommentar "PRO2 transfer" - vermutlich ein Datensignal (Touchscreen/
# Kompatibilitaetsmodus), kein einfacher Schalter.

[output_pin test_pc2_zprobe_mod]
pin: PC2
value: 0
shutdown_value: 0
# !!! "Z probe mod and LED" - falls eine Sonde/BLTouch angeschlossen ist,
# steuert das ggf. deren IR-LED. Nur testen wenn Sonde bekannt/entfernt.

