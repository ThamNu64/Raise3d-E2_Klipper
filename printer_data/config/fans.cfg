# ============================================================================
#  LUEFTER   -  ACHTUNG: Raise3D hat Fan0/Fan1 getauscht ("raise switched 55 58")
# ============================================================================
#  COOLING_FAN_PINS = { 58, 55, 00, ... } -> Fan0=PC26, Fan1=PC23, Fan2=PA0
[fan]               # Bauteilluefter (M106 P0) = Fan0
pin: PC26                  # COOLING_FAN 58 = PC26
cycle_time: 0.002          # M106 F500 = 500 Hz

[fan_generic fan_e1]       # Bauteilluefter (M106 P0) = Fan1
pin: PC27                  # COOLING_FAN 58 = PC26
cycle_time: 0.002          # M106 F500 = 500 Hz

[heater_fan hotend_fan_e0]  # Hotend-Luefter E0 (M106 P1) = Fan1
pin: PC23                  # COOLING_FAN 55 = PC23
heater: extruder
heater_temp: 50.0

[heater_fan hotend_fan_e1]  # Hotend-Luefter E1 (M106 P2) = Fan2
pin: PA0                   # COOLING_FAN 00 = PA0
heater: extruder1
heater_temp: 50.0