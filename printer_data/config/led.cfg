# ====================================================================
# LED & Beleuchtungs-Konfiguration (led.cfg)
# ====================================================================

# --------------------------------------------------------------------
# 1. HARDWARE-DEFINITIONEN (NeoPixel / Stealthburner / Toolheads)
# --------------------------------------------------------------------

# Toolhead 0 LEDs (Beispiel-Pin anpassen, z.B. auf dem T0-Toolheadboard)
[neopixel t0_leds]
pin: ebcan_t0:gpio20       # <-- Deinen Pin für T0 eintragen
chain_count: 3             # Anzahl LEDs am Kopfelement (z.B. Logo + Nozzle)
color_order: GRBW          # Oder GRB / RGB je nach LED-Typ
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

# Toolhead 1 LEDs (Beispiel-Pin anpassen, z.B. auf dem T1-Breakout/Board)
[neopixel t1_leds]
pin: ebcan_t1:gpio20       # <-- Deinen Pin für T1 eintragen
chain_count: 3             # Anzahl LEDs am Kopfelement
color_order: GRBW          # Oder GRB / RGB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0 

# --------------------------------------------------------------------
# 2. BAURAUMBELEUCHTUNG (Chamber Light)
# --------------------------------------------------------------------
# ============================================================================
#  BAURAUMBELEUCHTUNG UND LÜFTER
# ============================================================================

[output_pin chamber_light]
pin: PA15
value: 1
shutdown_value: 0

[gcode_macro CHAMBER_LIGHT]
description: Schaltet das Bauraumlicht ein (1/ON), aus (0/OFF) oder toggelt
gcode:
    {% set mode = params.VALUE|default("TOGGLE")|upper %}
    {% if mode == "ON" or mode == "1" %}
        SET_PIN PIN=chamber_light VALUE=1
    {% elif mode == "OFF" or mode == "0" %}
        SET_PIN PIN=chamber_light VALUE=0
    {% else %}
        {% set current = printer['output_pin chamber_light'].value %}
        SET_PIN PIN=chamber_light VALUE={0 if current > 0 else 1}
    {% endif %}

# Kompatibilität für bestehende Aufrufe
[gcode_macro LIGHT_ON]
gcode:
    CHAMBER_LIGHT VALUE=1

[gcode_macro LIGHT_OFF]
gcode:
    CHAMBER_LIGHT VALUE=0


# --------------------------------------------------------------------
# 3. IDEX STATUS-STEUERUNG (Steuert T0 & T1 Toolhead LEDs)
# --------------------------------------------------------------------

[gcode_macro _UPDATE_IDEX_LEDS]
description: Setzt die Farben der Toolhead-LEDs passend zum IDEX-Modus
gcode:
    {% set mode = params.MODE|default("BOTH")|upper %}

    # Farndefinitionen (Werte 0.0 bis 1.0)
    {% set active_r = 0.0 %}
    {% set active_g = 0.0 %}
    {% set active_b = 0.0 %}
    {% set active_w = 1.0 %} ; Aktiver Kopf: Hellweiß

    {% set standby_r = 0.0 %}
    {% set standby_g = 0.0 %}
    {% set standby_b = 0.2 %} ; Inaktiver Kopf: Gedimmtes Blau
    {% set standby_w = 0.0 %}

    {% if mode == "T0" %}
        # T0 aktiv, T1 Standby
        SET_LED LED=t0_leds RED={active_r} GREEN={active_g} BLUE={active_b} WHITE={active_w} SYNC=0
        SET_LED LED=t1_leds RED={standby_r} GREEN={standby_g} BLUE={standby_b} WHITE={standby_w} SYNC=0

    {% elif mode == "T1" %}
        # T1 aktiv, T0 Standby
        SET_LED LED=t0_leds RED={standby_r} GREEN={standby_g} BLUE={standby_b} WHITE={standby_w} SYNC=0
        SET_LED LED=t1_leds RED={active_r} GREEN={active_g} BLUE={active_b} WHITE={active_w} SYNC=0

    {% elif mode == "BOTH" %}
        # Beide aktiv (Copy / Mirror Modus)
        SET_LED LED=t0_leds RED={active_r} GREEN={active_g} BLUE={active_b} WHITE={active_w} SYNC=0
        SET_LED LED=t1_leds RED={active_r} GREEN={active_g} BLUE={active_b} WHITE={active_w} SYNC=0

    {% elif mode == "OFF" %}
        # Beide aus
        SET_LED LED=t0_leds RED=0 GREEN=0 BLUE=0 WHITE=0 SYNC=0
        SET_LED LED=t1_leds RED=0 GREEN=0 BLUE=0 WHITE=0 SYNC=0
    {% endif %}