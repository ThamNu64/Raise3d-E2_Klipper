#####################################################################
# EXTRUDER LINKS (T0)
#####################################################################

[extruder]
step_pin: tool_left:PB4
dir_pin: tool_left:PB3
enable_pin: !tool_left:PA15

microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 9.500        # HGX Lite

nozzle_diameter: 0.400
filament_diameter: 1.750

heater_pin: tool_left:PA8

# Creality K1C Keramik-Hotend (Unicorn / Keramik-Heizblock)
# Verwendet typischerweise einen NTC 100k B3950 Thermistor
sensor_type: Generic 3950
sensor_pin: tool_left:PB0
pullup_resistor: 4700

min_temp: 0
max_temp: 300
min_extrude_temp: 170

control: pid

[tmc2209 extruder]
uart_pin: tool_left:PB5
run_current: 0.7
sense_resistor: 0.110

