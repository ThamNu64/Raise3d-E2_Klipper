# ============================================================================
#  FILAMENTSENSOREN  (M591 D0 C6 / D1 C7 -> Endstop-Input 6/7)
# ============================================================================
[filament_switch_sensor filament_e0]
switch_pin: ^PE1           # END_STOP_PINS[6] 97 = PE1  (C6)
pause_on_runout: True
runout_gcode: PAUSE
insert_gcode: RESUME
extruder: extruder

[filament_switch_sensor filament_e1]
switch_pin: ^PE2           # END_STOP_PINS[7] 98 = PE2  (C7)
pause_on_runout: True
runout_gcode: PAUSE
insert_gcode: RESUME
extruder: extruder1