# =====================================================================
# TOOLHEAD 0 (LINKS) - Mellow FLY SHT36 V3 (RP2040)
# =====================================================================

[mcu T0]
canbus_uuid: XXXXXXXXXXXX  # Hier deine UUID nach 'mou_query' eintragen

# --- STEPPER EXTRUDER (HGX Lite + NEMA 14) ---
[extruder]
step_pin: T0:gpio7
dir_pin: !T0:gpio6         # Bei Bedarf '!' entfernen/hinzufügen für Drehrichtung
enable_pin: !T0:gpio14
microsteps: 16
rotation_distance: 5.7     # Richtwert für HGX Lite (muss noch kalibriert werden)
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: T0:gpio23      # K1C Unicorn Heizpatrone
sensor_type: EPCOS 100K B57560G104+  # Standard NTC100K für K1C Unicorn
sensor_pin: T0:gpio27
min_temp: 0
max_temp: 300
max_extrude_cross_section: 5

[tmc2209 extruder]
uart_pin: T0:gpio15
run_current: 0.550         # Angepasst für NEMA 14 Pancake
stealthchop_threshold: 0

# --- LÜFTER (24V) ---
[heater_fan hotend_fan_T0]
pin: T0:gpio13             # 3010 Lüfter (Kühlkörper)
heater: extruder
heater_temp: 50.0

[fan_generic fan_T0]       # Bauteilkühlung T0 (2x 4010 Blowers parallel)
pin: T0:gpio24

# --- NEOPIXEL LED (Dragon Burner) ---
[neopixel led_T0]
pin: T0:gpio26
chain_count: 3             # 3 LEDs im Dragon Burner Kit
color_order: GRB
initial_RED: 0.0
initial_GREEN: 1.0
initial_BLUE: 0.0

# --- FLY EDDY Z-PROBE ---
[probe_eddy_current fly_eddy_T0]
sensor_type: ldc1612
# Anbindung je nachdem, ob per I2C am SHT36 oder direkt USB/MCU
